<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>סקר רשתות רפאים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <button id="toggle-panel" class="icon-btn" aria-label="הצג או הסתר את רשימת האתרים" aria-controls="panel">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="15" cy="15" r="12.5"/>
        <path d="M2.5 15h25M15 2.5v25" stroke-dasharray="2 2.5"/>
        <path d="M6 19c2.2-1.6 4.4-1.6 6.6 0s4.4 1.6 6.6 0 4.4-1.6 4.8-.8" stroke-width="2"/>
      </svg>
      <div>
        <h1>סקר רשתות רפאים</h1>
        <p><bdi class="mono" dir="ltr">33°05′N – 31°33′N</bdi> · ים התיכון · 0–15 מ'</p>
      </div>
    </div>
    <div class="bar-actions">
      <span id="sync" class="sync local"></span>
      <button id="new-survey-btn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>
        סקר
      </button>
      <details class="menu" id="menu">
        <summary class="btn btn-ghost" aria-label="תפריט">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="14" cy="9" r="1.6"/></svg>
        </summary>
        <div class="menu-pop" role="menu">
          <div class="menu-user" id="menu-user"></div>
          <button data-menu="draw-ridge" role="menuitem">סמן רכס תת-ימי</button>
          <button data-menu="add-site" role="menuitem">הוסף אתר צלילה</button>
          <button data-menu="data" role="menuitem">ייצוא, ייבוא וגיבוי</button>
          <button data-menu="team" class="owner-only" role="menuitem">ניהול צוות</button>
          <button data-menu="signout" class="signed-only" role="menuitem">יציאה</button>
        </div>
      </details>
    </div>
  </header>

  <div class="layout">
    <aside id="panel" class="panel" aria-label="אתרים">
      <button class="panel-handle" id="panel-handle" aria-label="הרחב או כווץ את הרשימה"><span></span></button>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="log" aria-selected="true">יומן סקרים</button>
        <button role="tab" data-tab="sites" aria-selected="false">אתרי צלילה</button>
      </div>
      <div class="panel-scroll" id="pane-log">
        <section class="progress" aria-label="סיכום הסקרים">
          <div class="progress-head">
            <div class="count"><span class="big" id="log-count">0</span></div>
            <div class="count-label"><b>צלילות סקר</b><span class="log-sub" id="log-sub"></span></div>
          </div>
          <ul class="chips" id="log-chips"></ul>
        </section>
        <div class="filters">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
            <input id="log-search" type="search" placeholder="חיפוש לפי מקום, צוות או צולל" aria-label="חיפוש ביומן">
          </div>
        </div>
        <div id="log-list"></div>
      </div>
      <div class="panel-scroll hidden" id="pane-sites">
      <section class="progress" aria-label="התקדמות הסקר">
        <div class="progress-head">
          <div class="count"><span class="big" id="done-count">0</span><span class="slash">/</span><span class="total" id="total-count">0</span></div>
          <div class="count-label"><b>אתרי צלילה מוכרזים נסקרו</b></div>
        </div>
        <div class="coastbar" id="coastbar" aria-label="כל האתרים לאורך החוף, מצפון לדרום"></div>
        <div class="coastbar-ends" aria-hidden="true"><span>ראש הנקרה</span><span>צפון ← דרום</span><span>זיקים</span></div>
        <ul class="chips" id="status-chips"></ul>
      </section>
        <div class="filters">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
            <input id="search" type="search" placeholder="חיפוש אתר" aria-label="חיפוש אתר">
          </div>
          <select id="filter-region" aria-label="אזור">
            <option value="">כל האזורים</option>
            <option value="north">צפון · ראש הנקרה–עכו</option>
            <option value="carmel">חיפה וחוף הכרמל</option>
            <option value="sharon">השרון</option>
            <option value="center">גוש דן</option>
            <option value="south">דרום</option>
          </select>
          <select id="filter-category" aria-label="סוג אתר">
            <option value="">כל הסוגים</option>
          </select>
          <label class="switch"><input type="checkbox" id="filter-shallow"> רק אתרים בתוך רצועת ה-15 מ' <span class="line" aria-hidden="true"></span></label>
        </div>
        <div id="site-list"></div>
      </div>
    </aside>

    <main id="map" aria-label="מפה"></main>
  </div>

  <!-- Floating toolbar for map-drawing modes -->
  <div id="draw-bar" class="draw-bar hidden" role="status">
    <span id="draw-msg"></span>
    <button id="draw-undo" class="btn small">בטל נקודה</button>
    <button id="draw-done" class="btn btn-primary small">סיום</button>
    <button id="draw-cancel" class="btn btn-ghost small">ביטול</button>
  </div>

  <!-- Generic modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close icon-btn" id="modal-close" aria-label="סגור">
        <svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="confirm" class="modal confirm hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-msg">
    <div class="modal-card">
      <p id="confirm-msg"></p>
      <div class="form-actions">
        <button id="confirm-ok" class="btn btn-danger">מחק</button>
        <button id="confirm-cancel" class="btn btn-ghost">ביטול</button>
      </div>
    </div>
  </div>

  <div id="gate" class="gate hidden" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-card">
      <svg class="gate-mark" width="56" height="56" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="15" cy="15" r="12.5"/><path d="M2.5 15h25M15 2.5v25" stroke-dasharray="2 2.5"/>
        <path d="M6 19c2.2-1.6 4.4-1.6 6.6 0s4.4 1.6 6.6 0 4.4-1.6 4.8-.8" stroke-width="2"/>
      </svg>
      <h2 id="gate-title"></h2>
      <p id="gate-text"></p>
      <div class="gate-actions" id="gate-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="data/sites.js"></script>
  <script src="data/coast.js"></script>
  <script src="data/bathy.js"></script>
  <script src="data/places.js"></script>
  <script src="data/ridges.js"></script>
  <script src="data/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
